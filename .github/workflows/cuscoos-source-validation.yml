name: CuscoOS Source Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "manifest/cuscoos.xml"
      - ".github/workflows/cuscoos-source-validation.yml"

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout CuscoOS
        uses: actions/checkout@v4

      - name: Validate manifest XML
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest/cuscoos.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "manifest/cuscoos.xml"
          root = ET.parse(path).getroot()
          projects = root.findall("project")

          print("Manifest XML is valid.")
          print(f"Projects found: {len(projects)}")

          if len(projects) != 9:
              raise SystemExit(
                  f"Expected 9 source projects; found {len(projects)}"
              )

          for project in projects:
              name = project.get("name")
              revision = project.get("revision")
              if not name or not revision:
                  raise SystemExit(
                      "Every project must specify name and revision."
                  )
              print(f"Project: {name} | revision: {revision}")
          PY

      - name: Verify pinned commits on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          root = ET.parse("manifest/cuscoos.xml").getroot()
          remotes = {
              remote.get("name"): remote.get("fetch")
              for remote in root.findall("remote")
          }

          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "CuscoOS-Source-Validation",
          }
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          failures = []

          for project in root.findall("project"):
              name = project.get("name")
              revision = project.get("revision")
              remote_name = project.get("remote")
              fetch = remotes.get(remote_name)

              if not fetch:
                  failures.append(
                      f"{name}: remote '{remote_name}' is missing."
                  )
                  continue

              base = fetch.rstrip("/")
              repo = name.strip("/")
              if base.endswith(".git"):
                  base = base[:-4]
              url = f"{base}/{repo}"
              if url.endswith(".git"):
                  url = url[:-4]

              if "github.com/" not in url:
                  failures.append(
                      f"{name}: unsupported GitHub URL {url}"
                  )
                  continue

              slug = url.split("github.com/", 1)[1].strip("/")
              if slug.count("/") != 1:
                  failures.append(
                      f"{name}: cannot parse repository URL {url}"
                  )
                  continue

              api_url = (
                  "https://api.github.com/repos/"
                  f"{slug}/commits/{revision}"
              )
              request = urllib.request.Request(
                  api_url, headers=headers
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=20
                  ) as response:
                      data = json.load(response)
                  actual = data.get("sha", "")
                  if actual.lower() != revision.lower():
                      failures.append(
                          f"{name}: returned SHA differs from pinned SHA."
                      )
                  else:
                      print(f"PASS: {slug} @ {actual}")
              except urllib.error.HTTPError as exc:
                  failures.append(
                      f"{slug} @ {revision}: GitHub API HTTP {exc.code}"
                  )
              except Exception as exc:
                  failures.append(
                      f"{slug} @ {revision}: {exc}"
                  )

          if failures:
              print("\nVALIDATION FAILURES:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)

          print("\nAll four pinned commits were verified.")
          PY
