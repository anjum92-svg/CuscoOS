name: CuscoOS Source Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "manifest/cuscoos.xml"
      - ".github/workflows/cuscoos-source-validation.yml"

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout CuscoOS
        uses: actions/checkout@v4

      - name: Validate manifest XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("manifest/cuscoos.xml").getroot()
          projects = root.findall("project")

          print("Manifest XML is valid.")
          print(f"Projects found: {len(projects)}")

          if len(projects) != 8:
              raise SystemExit(
                  f"Expected 8 device source projects; found {len(projects)}"
              )

          paths = set()
          for project in projects:
              name = project.get("name")
              path = project.get("path")
              revision = project.get("revision")
              remote = project.get("remote")

              if not all((name, path, revision, remote)):
                  raise SystemExit(
                      "Every project needs name, path, revision and remote."
                  )

              if path in paths:
                  raise SystemExit(f"Duplicate project path: {path}")
              paths.add(path)

              if revision != "lineage-23.2":
                  raise SystemExit(
                      f"{name}: unexpected revision {revision}"
                  )

              print(f"OK: {name} -> {path} [{revision}]")
          PY

      - name: Verify repository branches on GitHub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          root = ET.parse("manifest/cuscoos.xml").getroot()
          remotes = {
              r.get("name"): r.get("fetch")
              for r in root.findall("remote")
          }

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "CuscoOS-Source-Validation",
          }
          failures = []

          for project in root.findall("project"):
              name = project.get("name")
              revision = project.get("revision")
              remote = project.get("remote")
              fetch = remotes.get(remote, "")

              if not fetch.startswith("https://github.com/"):
                  failures.append(f"{name}: unsupported remote {fetch}")
                  continue

              slug = name.strip("/")
              if slug.count("/") != 1:
                  failures.append(f"{name}: expected owner/repository")
                  continue

              url = (
                  "https://api.github.com/repos/"
                  f"{slug}/commits/{revision}"
              )
              request = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(
                      request, timeout=20
                  ) as response:
                      data = json.load(response)

                  sha = data.get("sha", "")
                  if len(sha) != 40:
                      failures.append(
                          f"{slug}: GitHub did not return a full commit SHA"
                      )
                  else:
                      print(
                          f"PASS: {slug} branch {revision} "
                          f"resolves to {sha}"
                      )
              except urllib.error.HTTPError as exc:
                  failures.append(
                      f"{slug} branch {revision}: HTTP {exc.code}"
                  )
              except Exception as exc:
                  failures.append(f"{slug}: {exc}")

          if failures:
              print("\nVALIDATION FAILURES:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)

          print("\nAll device repository branches resolved.")
          PY
